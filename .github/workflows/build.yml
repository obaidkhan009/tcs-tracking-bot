name: Build downloadable apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: TCS-Tracker-Windows.exe
            label: windows
          - os: macos-latest
            asset: TCS-Tracker-macOS-AppleSilicon.zip
            label: mac-arm
          - os: macos-13
            asset: TCS-Tracker-macOS-Intel.zip
            label: mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --console --name TCS-Tracker --clean tracker.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\TCS-Tracker.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/TCS-Tracker
          cp shipments_sample.xlsx dist/
          cd dist && zip -r ../${{ matrix.asset }} TCS-Tracker shipments_sample.xlsx

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then ./dist/TCS-Tracker.exe --help; else ./dist/TCS-Tracker --help; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body: |
            Download the file for your computer, then follow the steps in the README.
            - Windows: `TCS-Tracker-Windows.exe`
            - Mac with Apple chip (M1/M2/M3/M4): `TCS-Tracker-macOS-AppleSilicon.zip`
            - Mac with Intel chip: `TCS-Tracker-macOS-Intel.zip`
